<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title if title else "Student Admission Portal" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #e0dcdd, #ececec); color: #fff; }
    .navbar { background: rgba(192, 65, 118, 0.733); backdrop-filter: blur(10px); }
    .navbar a { color: #fff !important; font-weight: 500; }
    .card { border-radius: 15px; }
    .card-header { background-color: #4b6cb7; color: white; font-weight: 600; }
    .btn-custom { background-color: #00bcd4; color: #fff; border: none; }
    .btn-custom:hover { background-color: #0194a7; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">🎓 Vetri Tech Admissions</a>
      <div class="ms-auto">
        <a href="/" class="btn btn-outline-light btn-sm me-2">Home</a>
        <a href="/admin" class="btn btn-custom btn-sm text-dark">Admin Login</a>
      </div>
    </div>
  </nav>
  <div class="container my-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="alert alert-{{ category }} text-dark">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
